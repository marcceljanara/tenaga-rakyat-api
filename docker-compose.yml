version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: tenaga-rakyat-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tenaga-rakyat-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tenaga-rakyat-api
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Internal Docker URLs
      DATABASE_URL: ${DOCKER_DATABASE_URL}
      # Update these variables based on your actual application .env expectations for Redis config
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      # Include any other essential production environment variables below
      # JWT_SECRET: "your_secret_here"
    volumes:
      # Uploads persist in docker managed volume mapped to /app/uploads
      - uploads-data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  # Using named volumes is the best practice for persistency in Docker and VPS deployments
  postgres-data:
  redis-data:
  uploads-data:
