services:
  postgres:
    ports: !reset []
    networks:
      - app-network

  redis:
    ports: !reset []
    networks:
      - app-network

  api:
    environment:
      NODE_ENV: production
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - app-network

networks:
  app-network:
    name: tenaga-rakyat-network
