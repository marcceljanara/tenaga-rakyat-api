services:
  postgres:
    ports: !reset []
    networks:
      - app-network

  redis:
    ports: !reset []
    networks:
      - app-network

  api:
    environment:
      NODE_ENV: production
      PORT: "3000"
    networks:
      - app-network

  nginx:
    image: nginx:1.27-alpine
    container_name: tenaga-rakyat-nginx
    restart: always
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    command: >
      /bin/sh -c 'while :; do sleep 6h; nginx -s reload; done &
      nginx -g "daemon off;"'
    networks:
      - app-network

  certbot:
    image: certbot/certbot:latest
    container_name: tenaga-rakyat-certbot
    restart: unless-stopped
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: /bin/sh
    command: >
      -c "trap exit TERM; while :; do certbot renew --webroot
      -w /var/www/certbot --quiet; sleep 12h; done;"
    networks:
      - app-network

volumes:
  certbot-etc:
  certbot-www:

networks:
  app-network:
    name: tenaga-rakyat-network
