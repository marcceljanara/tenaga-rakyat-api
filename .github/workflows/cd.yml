name: Continuous Deployment

on:
  workflow_run:
    workflows:
      - Continuous Integration
    types:
      - completed
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'master')
    environment: production

    env:
      DEPLOY_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      REPOSITORY: ${{ github.repository }}
      APP_DIR: ${{ secrets.DEPLOY_PATH }}

    steps:
      - name: Deploy application on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_BRANCH: ${{ env.DEPLOY_BRANCH }}
          DEPLOY_SHA: ${{ env.DEPLOY_SHA }}
          REPOSITORY: ${{ env.REPOSITORY }}
          APP_DIR: ${{ env.APP_DIR }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: DEPLOY_BRANCH,DEPLOY_SHA,REPOSITORY,APP_DIR
          script_stop: true
          script: |
            set -eu
            DEPLOY_LOG="/tmp/deploy_$$.log"
            exec > >(tee -a "$DEPLOY_LOG") 2>&1
            trap 'echo "--- DEPLOY FAILED ---"; echo "Last 30 lines of log:"; tail -30 "$DEPLOY_LOG" 2>/dev/null || true' ERR

            if [ -z "${APP_DIR:-}" ]; then
              APP_DIR="$HOME/tenaga-rakyat-api"
            fi

            compose() {
              docker compose -f docker-compose.yml -f docker-compose.prod.yml "$@"
            }

            echo "1. Checking required tools"
            command -v git >/dev/null 2>&1
            command -v docker >/dev/null 2>&1
            docker compose version

            echo "2. Preparing application directory: $APP_DIR"
            if [ ! -d "$APP_DIR/.git" ]; then
              mkdir -p "$APP_DIR"
              git clone --branch "$DEPLOY_BRANCH" "https://github.com/$REPOSITORY.git" "$APP_DIR"
            fi

            cd "$APP_DIR"

            echo "3. Pulling repository commit: $DEPLOY_SHA"
            git fetch --prune origin "$DEPLOY_BRANCH"
            git checkout -B "$DEPLOY_BRANCH" "$DEPLOY_SHA"
            git reset --hard "$DEPLOY_SHA"

            echo "4. Validating production files"
            test -f Dockerfile
            test -f docker-compose.yml
            test -f docker-compose.prod.yml
            test -f .env
            compose config --quiet

            echo "5. Pulling base images"
            compose pull postgres redis || true

            echo "6. Building and starting production stack"
            compose up -d --build --remove-orphans

            echo "7. Current production containers"
            compose ps

            echo "8. Cleaning unused Docker images"
            docker image prune -f
