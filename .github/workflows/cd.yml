name: Continuous Deployment

on:
  workflow_run:
    workflows:
      - Continous Integration
    types:
      - completed
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment: production

    env:
      DOMAIN: api.tenagarakyat.site
      DEPLOY_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      REPOSITORY: ${{ github.repository }}
      APP_DIR: ${{ secrets.DEPLOY_PATH }}
      LETSENCRYPT_EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}

    steps:
      - name: Deploy application on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          DOMAIN: ${{ env.DOMAIN }}
          DEPLOY_BRANCH: ${{ env.DEPLOY_BRANCH }}
          DEPLOY_SHA: ${{ env.DEPLOY_SHA }}
          REPOSITORY: ${{ env.REPOSITORY }}
          APP_DIR: ${{ env.APP_DIR }}
          LETSENCRYPT_EMAIL: ${{ env.LETSENCRYPT_EMAIL }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: DOMAIN,DEPLOY_BRANCH,DEPLOY_SHA,REPOSITORY,APP_DIR,LETSENCRYPT_EMAIL
          script_stop: true
          script: |
            set -eu
            trap 'echo "DEPLOY ERROR at line $LINENO — command: $BASH_COMMAND"' ERR

            if [ -z "${APP_DIR:-}" ]; then
              APP_DIR="$HOME/tenaga-rakyat-api"
            fi

            if [ -z "${LETSENCRYPT_EMAIL:-}" ] && [ -f "${APP_DIR}/.env" ]; then
              email_line="$(sed -n 's/^LETSENCRYPT_EMAIL=//p' "${APP_DIR}/.env" | tail -n 1)"
              LETSENCRYPT_EMAIL="$(printf '%s' "$email_line" | tr -d "'\"")"
            fi

            if [ -z "${LETSENCRYPT_EMAIL:-}" ]; then
              echo "ERROR: LETSENCRYPT_EMAIL is required. Set the GitHub secret or add it to the VPS .env file."
              exit 1
            fi

            compose() {
              docker compose -f docker-compose.yml -f docker-compose.prod.yml "$@"
            }

            echo "1. Checking required tools"
            command -v git >/dev/null 2>&1
            command -v docker >/dev/null 2>&1
            docker compose version

            echo "2. Preparing application directory: $APP_DIR"
            if [ ! -d "$APP_DIR/.git" ]; then
              mkdir -p "$APP_DIR"
              git clone --branch "$DEPLOY_BRANCH" "https://github.com/$REPOSITORY.git" "$APP_DIR"
            fi

            cd "$APP_DIR"

            echo "3. Pulling repository commit: $DEPLOY_SHA"
            git fetch --prune origin "$DEPLOY_BRANCH"
            git checkout -B "$DEPLOY_BRANCH" "$DEPLOY_SHA"
            git reset --hard "$DEPLOY_SHA"

            echo "4. Validating production files"
            test -f Dockerfile
            test -f docker-compose.yml
            test -f docker-compose.prod.yml
            test -f nginx/conf.d/api.tenagarakyat.site.conf
            test -f .env
            compose config --quiet

            echo "5. Provisioning SSL certificate"

            echo "   [5.1] Resolving project name..."
            project_name="$(basename "${APP_DIR%/}")"
            vol_etc="${project_name}_certbot-etc"
            vol_www="${project_name}_certbot-www"
            echo "   Project: $project_name | vol_etc: $vol_etc"

            echo "   [5.2] Creating volumes..."
            docker volume create "$vol_etc" > /dev/null 2>&1 || true
            docker volume create "$vol_www" > /dev/null 2>&1 || true

            echo "   [5.3] Checking existing certificate..."
            certbot_log="/tmp/certbot_$$"
            docker run --rm \
              -v "${vol_etc}:/etc/letsencrypt" \
              certbot/certbot:latest \
              certificates --domain "$DOMAIN" > "$certbot_log" 2>&1 || true
            echo "   [5.3] done — certbot log:"
            cat "$certbot_log" || true

            cert_valid=false
            grep -qi "VALID" "$certbot_log" 2>/dev/null && cert_valid=true || true
            echo "   cert_valid=$cert_valid"

            if [ "$cert_valid" = "true" ]; then
              echo "   Certificate OK — skipping issuance"
            else
              echo "   Freeing port 80 for standalone challenge..."
              systemctl stop nginx 2>/dev/null || true
              docker ps -q --filter publish=80 | xargs -r docker stop 2>/dev/null || true
              sleep 3

              echo "   Running certbot standalone (output captured)..."
              standalone_log="/tmp/certbot_standalone_$$"
              certbot_exit=0
              docker run --rm \
                -p 80:80 \
                -v "${vol_etc}:/etc/letsencrypt" \
                -v "${vol_www}:/var/www/certbot" \
                certbot/certbot:latest \
                certonly --standalone \
                -d "$DOMAIN" \
                --email "$LETSENCRYPT_EMAIL" \
                --agree-tos --no-eff-email --non-interactive \
                > "$standalone_log" 2>&1 || certbot_exit=$?

              echo "   Certbot standalone output:"
              cat "$standalone_log" || true
              rm -f "$standalone_log"

              if [ "$certbot_exit" -ne 0 ]; then
                systemctl start nginx 2>/dev/null || true
                echo "ERROR: certbot standalone failed with exit code $certbot_exit"
                exit 1
              fi

              systemctl start nginx 2>/dev/null || true
            fi
            rm -f "$certbot_log"

            echo "6. Pulling base images"
            compose pull nginx certbot postgres redis || true

            echo "7. Building and starting production stack"
            compose up -d --build --remove-orphans

            echo "8. Current production containers"
            compose ps

            echo "9. Cleaning unused Docker images"
            docker image prune -f
